services:
  - type: web
    name: flujo-caja-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run flujo_caja_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: flujo-caja-db
    databaseName: flujo_caja
    user: flujo_caja_user
    plan: free

